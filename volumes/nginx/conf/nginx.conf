worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/json;
    sendfile        on;
    keepalive_timeout  65;

    # 负载均衡配置
    upstream backend {
        # 【重要修改】在Docker中连接宿主机的Java服务，不能用127.0.0.1
        # 必须用 host.docker.internal
        server host.docker.internal:8081 max_fails=5 fail_timeout=10s weight=1;
        server host.docker.internal:8082 max_fails=5 fail_timeout=10s weight=1;
    }

    server {
        # 监听容器内的 8080 端口
        listen       8080;
        server_name  localhost;

        # 前端项目位置
        location / {
            # 【重要修改】使用容器内的绝对路径
            # 对应挂载关系：宿主机 ./html -> 容器 /usr/share/nginx/html
            root   /usr/share/nginx/html/hmdp;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }

        location /api {
            default_type  application/json;
            keepalive_timeout   30s;
            keepalive_requests  1000;
            
            proxy_http_version 1.1;
            # 路径重写
            rewrite /api(/.*) $1 break;
            
            proxy_pass_request_headers on;
            proxy_next_upstream error timeout;
            
            # 反向代理到上面的 upstream backend
            proxy_pass http://backend;
        }
    }
}
